<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Servo Studio</title>
<style>
  :root {
    --ink: #1d1d1f; --dim: rgba(60, 60, 67, .6); --glass: rgba(255, 255, 255, .52); --edge: rgba(255, 255, 255, .75);
    --fill: rgba(120, 120, 128, .14); --shadow: 0 12px 40px rgba(31, 38, 60, .14); --line: rgba(60, 60, 67, .28);
    --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30;
    --bg: radial-gradient(60vw 60vh at 12% 8%, #dfe9ff, transparent 70%), radial-gradient(50vw 55vh at 92% 18%, #ffe9d6, transparent 70%),
          radial-gradient(60vw 60vh at 60% 105%, #dff7ea, transparent 70%), #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f7; --dim: rgba(235, 235, 245, .6); --glass: rgba(44, 44, 50, .5); --edge: rgba(255, 255, 255, .16);
      --fill: rgba(120, 120, 128, .28); --shadow: 0 12px 40px rgba(0, 0, 0, .45); --line: rgba(235, 235, 245, .3);
      --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a;
      --bg: radial-gradient(60vw 60vh at 12% 8%, #1c2a4d, transparent 70%), radial-gradient(50vw 55vh at 92% 18%, #45291c, transparent 70%),
            radial-gradient(60vw 60vh at 60% 105%, #153828, transparent 70%), #0b0b0d;
    }
  }
  :root { --spring: cubic-bezier(.3, 1.5, .5, 1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  #vw, #lines, #tags { position: fixed; inset: 0; }
  #vw canvas { width: 100%; height: 100%; display: block; }
  #lines, #tags { pointer-events: none; width: 100%; height: 100%; }
  #lines line { stroke: var(--line); stroke-width: 1; }
  #lines circle { fill: var(--line); }
  #lines .on line { stroke: var(--blue); stroke-width: 1.5; } #lines .on circle { fill: var(--blue); }

  .glass { background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow), inset 0 1px 0 var(--edge);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); }
  button, select, input { font: inherit; color: inherit; }
  button, select { border: 0; border-radius: 999px; padding: 8px 16px; background: var(--fill); cursor: pointer; font-weight: 500;
    transition: transform .35s var(--spring), background .3s, color .3s, opacity .3s; -webkit-appearance: none; appearance: none; }
  button:active { transform: scale(.92); }
  button:disabled { opacity: .35; cursor: default; }
  button.pri { background: var(--blue); color: #fff; }
  [hidden] { display: none !important; }

  #bar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    padding: 8px; border-radius: 999px; white-space: nowrap; }
  #dot, #bdot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin: 0 4px 0 10px; transition: background .3s; }
  #dot.on, #bdot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  #bdot { margin: 0 -2px 0 6px; }
  #bdot.busy { background: var(--orange); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  #count { color: var(--dim); font-variant-numeric: tabular-nums; padding-right: 10px; }
  /* found servos: a pill under the bar that pours in, each servo popping after the last */
  #found { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; border-radius: 999px;
    max-width: calc(100% - 36px); overflow-x: auto; scrollbar-width: none;
    transition: opacity .35s, filter .35s, transform .6s cubic-bezier(.3, 1.5, .5, 1); }
  #runnote { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 18px; border-radius: 999px; white-space: nowrap; color: var(--dim); font-size: 14px; }
  #runnote b { color: var(--ink); } #runnote[hidden] { display: none; }
  #found.empty { opacity: 0; filter: blur(10px); transform: translateX(-50%) translateY(-16px) scale(.6); pointer-events: none; }
  #found a { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; cursor: pointer; user-select: none;
    animation: pop .6s cubic-bezier(.3, 1.5, .5, 1) backwards; animation-delay: calc(var(--i) * 30ms + 120ms);
    transition: background .25s, color .25s, transform .25s cubic-bezier(.3, 1.5, .5, 1); }
  #found a:hover { background: var(--fill); transform: scale(1.08); } #found a:active { transform: scale(.94); }
  #found a { position: relative; z-index: 1; } #found a.sel { color: #fff; }
  /* one highlight that slides and stretches between choices, instead of one switching off and another on */
  .blob { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 999px; background: var(--blue); opacity: 0; pointer-events: none;
    transition: left .5s var(--spring), width .5s var(--spring), opacity .25s; }
  .seg { position: relative; } .seg .blob { top: 2px; bottom: 2px; background: var(--glass); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  .seg button { position: relative; z-index: 1; }
  #found b { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #found u { width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background .3s; }
  #found u.bad { background: var(--red); } #found u.new { background: var(--orange); } #found a.sel u { background: #fff; }
  @keyframes pop { from { opacity: 0; filter: blur(6px); transform: scale(.3) translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }

  .tag { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; align-items: baseline;
    gap: 7px; padding: 6px 13px; border-radius: 999px; user-select: none;
    transition: background .3s, color .3s, opacity .3s, box-shadow .3s, transform .45s var(--spring);
    animation: tagpop .6s var(--spring) backwards; animation-delay: calc(var(--i) * 28ms + 150ms); }
  .tag:hover { transform: translate(-50%, -50%) scale(1.06); }
  @keyframes tagpop { from { opacity: 0; filter: blur(6px); transform: translate(-50%, -50%) scale(.4); } }
  .tag b { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tag i { font-style: normal; font-size: 12px; color: var(--dim); }
  .tag.off { opacity: .5; }
  .tag.ok b { color: var(--green); } .tag.bad b { color: var(--red); }
  .tag.sel { background: var(--blue); border-color: transparent; transform: translate(-50%, -50%) scale(1.1); } .tag.sel b, .tag.sel i { color: #fff; }
  .tag.aim { box-shadow: 0 0 0 2px var(--blue), var(--shadow); opacity: 1; }

  #card { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 22px;
    padding: 16px 22px; border-radius: 28px; white-space: nowrap; }
  #who b { display: block; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #who span { color: var(--dim); font-size: 13px; }
  .sw { width: 51px; height: 31px; padding: 0; background: var(--fill); position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: transform .22s cubic-bezier(.3, 1.3, .6, 1); }
  .sw.on { background: var(--green); } .sw.on::after { transform: translateX(20px); }
  input[type=range] { width: 170px; accent-color: var(--blue); }
  .lab { color: var(--dim); }
  .num { width: 62px; border: 0; border-radius: 12px; padding: 8px 0; text-align: center; background: var(--fill); font-weight: 600;
    font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield; }
  .num::-webkit-inner-spin-button { -webkit-appearance: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); opacity: .5; }
  .seg { display: flex; background: var(--fill); border-radius: 999px; padding: 2px; }
  .seg button { background: none; padding: 6px 14px; color: var(--dim); }
  .seg button.on { color: var(--ink); }
  #card { flex-direction: column; align-items: stretch; gap: 14px; transform-origin: 50% 100%;
    transition: opacity .3s, filter .3s, transform .6s var(--spring); }
  #card.empty { opacity: 0; filter: blur(14px); transform: translateX(-50%) translateY(46px) scale(.78); pointer-events: none; }
  #card > .row { gap: 22px; }
  #plots { display: flex; gap: 8px; height: 96px; }
  #plots canvas { flex: 1; min-width: 0; height: 100%; background: var(--fill); border-radius: 14px; }
  #plots .tools { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; }
  #plots .tools button { padding: 6px 12px; font-size: 13px; }
  .sw8 { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; }
  /* the duck's sensors: a dock of round buttons; one that is on grows into its window */
  #dock { position: fixed; left: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100% - 36px); overflow-y: auto; scrollbar-width: none; padding: 30px; margin: -30px; }
  .sn { width: 46px; height: 46px; flex: none; border-radius: 23px; overflow: hidden; position: relative; white-space: nowrap;
    transition: width .55s var(--spring), height .55s var(--spring), border-radius .4s;
    animation: pop .6s var(--spring) backwards; animation-delay: calc(var(--i) * 50ms + 250ms); }
  .sn.on { width: 216px; height: var(--h); border-radius: 22px; }
  .sn .ic { width: 44px; height: 44px; padding: 0; background: none; display: grid; place-items: center; color: var(--dim); }
  .sn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .sn.ok .ic { color: var(--green); } .sn.bad .ic { color: var(--red); } .sn.on .ic { color: var(--blue); }
  .sn b, .sn i { position: absolute; top: 13px; opacity: 0; transition: opacity .3s; } .sn.on b, .sn.on i { opacity: 1; transition-delay: .15s; }
  .sn b { left: 46px; font-weight: 600; } .sn i { right: 14px; top: 15px; font-style: normal; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .sn.bad i { color: var(--red); }
  .sn .view { position: absolute; left: 11px; top: 46px; width: 192px; }
  .sn canvas { width: 192px; display: block; border-radius: 12px; background: var(--fill); }
  #imub { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; } #imub button { padding: 8px 0; font-size: 13px; }
  #imuw { grid-column: 1 / -1; margin: 2px 2px 0; font-size: 11px; line-height: 1.3; color: var(--orange); }
  .sn.warn .ic { color: var(--orange); } .sn.warn i { color: var(--orange); }
  #imu1, #imu2 { grid-column: span 2; } #imu2:disabled { opacity: .35; } #imu1.done { box-shadow: inset 0 0 0 1.5px var(--green); }
  .sn .view:not(:has(canvas)) { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sn .view button { padding: 8px 0; font-size: 13px; }
  .sn .view button[data-a] { position: relative; overflow: hidden; padding: 5px 0 4px; font-size: 17px; line-height: 1.15; }
  .sn .view button[data-a] small { display: block; font-size: 10px; color: var(--dim); }
  .sn .view button[data-a] u { position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }
  .sn .view button[data-a]::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p, 0) * 100%); background: var(--blue); }
  .sn .view button.play { box-shadow: inset 0 0 0 1.5px var(--blue); }
  #astop { grid-column: 1 / -1; }
  #plvl { display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sn .view button[data-d] { font-size: 16px; touch-action: none; }
  /* calibration: a strip that drops in under the found row while the duck is being posed at home */
  #cal { position: fixed; top: 130px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 18px; border-radius: 999px; white-space: nowrap;
    transition: opacity .3s, filter .3s, transform .6s var(--spring); }
  #cal.empty { opacity: 0; filter: blur(10px); transform: translateX(-50%) translateY(-18px) scale(.7); pointer-events: none; }
  #cal i { font-style: normal; color: var(--dim); font-size: 13px; }
  #calib u { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 7px; vertical-align: 1px; }
  .nudge { width: 31px; height: 31px; padding: 0; font-size: 17px; line-height: 1; }
  #batt { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 6px; font-variant-numeric: tabular-nums; color: var(--green); }
  #batt svg { width: 30px; height: 14px; } #batt b { color: var(--ink); font-weight: 600; }
  #batt rect:first-child, #batt path { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-linecap: round; }
  #bfill { fill: currentColor; transition: width .6s var(--spring); }
  #batt.mid { color: var(--orange); } #batt.low { color: var(--red); } #batt.low b { color: var(--red); }
  #temp { display: flex; align-items: center; gap: 5px; padding: 0 10px 0 6px; font-variant-numeric: tabular-nums; color: var(--dim); }
  #temp svg { width: 9px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; } #temp circle { fill: currentColor; }
  #temp b { color: var(--ink); font-weight: 600; } #temp.mid { color: var(--orange); } #temp.low, #temp.low b { color: var(--red); }
  #tip { position: fixed; padding: 5px 10px; border-radius: 999px; color: var(--dim); pointer-events: none; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tip div { display: flex; gap: 8px; align-items: center; } #tip span:last-child { margin-left: auto; padding-left: 12px; font-weight: 600; }
  #tip small { color: var(--dim); }
  #toast { position: fixed; top: 186px; left: 50%; transform: translate(-50%, -8px); padding: 9px 18px; border-radius: 999px; opacity: 0;
    transition: opacity .25s, filter .25s, transform .5s var(--spring); filter: blur(8px); pointer-events: none; }
  #toast { transform: translate(-50%, -14px) scale(.7); } #toast.show { opacity: 1; filter: none; transform: translate(-50%, 0); }
  #toast.bad { color: var(--red); }
</style>
</head>
<body>
<div id="vw"></div>
<svg id="lines"></svg>
<div id="tags"></div>

<header id="bar" class="glass">
  <span id="dot"></span>
  <select id="port" title="Serial port"></select>
  <select id="baud" title="Baud rate"></select>
  <button id="link" class="pri">Connect</button>
  <button id="scan" disabled>Scan</button>
  <button id="calib" hidden title="Calibrate: lay the duck on its back, pose every joint at home, save">Calibrate</button>
  <button id="fix" hidden title="Move every found servo to 1 Mbit">Set 1M</button>
  <span id="count"></span>
  <span class="sep"></span>
  <span id="bdot"></span>
  <button id="blink" title="The duck's own computer and its sensors, over SSH">Duck</button>
  <div id="mode" class="seg" hidden title="Setup: the joints are yours to move, calibrate and test. Control: the duck's own policies drive it; steer from the Drive panel. Going back to Setup sits the duck down first."><button data-m="setup">Setup</button><button data-m="run">Control</button></div>
  <span id="temp" hidden><svg viewBox="0 0 9 16"><path d="M4.5 1.5v8.5"/><path d="M2.6 9.2V3.2a1.9 1.9 0 0 1 3.8 0v6a3.1 3.1 0 1 1-3.8 0z"/><circle cx="4.5" cy="11.7" r="1.5"/></svg><b></b></span>
  <span id="batt" hidden><svg viewBox="0 0 30 14"><rect x=".75" y=".75" width="25" height="12.5" rx="3.5"/><path d="M28 4.5v5"/><rect id="bfill" x="2.5" y="2.5" height="9" rx="2"/></svg><b></b></span>
</header>
<aside id="dock"></aside>
<div id="cal" class="glass empty">
  <b>Home pose</b><i>duck on its back, joints straight</i>
  <button id="chold" class="sw" title="Hold: torque on, so each joint can be trimmed"></button>
  <button id="csave" class="pri">Save</button><button id="ccancel">Cancel</button>
</div>
<nav id="found" class="glass empty"></nav>
<div id="runnote" class="glass" hidden><b>Vendor runtime</b> the image's own runtime has the servos (started from the phone), so none show here. <button class="pri" onclick="document.querySelector('#mode [data-m=setup]').click()">Back to Setup</button></div>

<section id="card" class="glass empty">
  <div id="plots">
    <canvas data-k="pos"></canvas><canvas data-k="vel"></canvas><canvas data-k="load"></canvas><canvas data-k="temp"></canvas>
    <div class="tools">
      <div id="win" class="seg"><button data-w="10" class="on">10s</button><button data-w="60">60s</button></div>
      <button id="csv">CSV</button>
    </div>
  </div>
  <div class="row">
  <div id="who"><b></b><span></span></div>
  <div class="sep"></div>
  <div class="row"><button id="torque" class="sw" title="Torque"></button><button id="dn" class="nudge" title="Nudge 0.2°">‹</button><input id="slide" type="range"><button id="up" class="nudge" title="Nudge 0.2°">›</button><button id="test">Test</button><button id="zero" title="Re-centre this servo's encoder: the present position will read 2048 (mid-travel), giving it full range both ways. The joint goes limp; switch its torque back on after.">Zero</button><button id="flip" hidden title="Reverse this joint's direction: its angle changes sign. Use it when the joint on screen turns the opposite way to the real one.">Flip</button></div>
  <div class="sep"></div>
  <div class="row"><span class="lab">ID</span><input id="to" class="num" type="number" min="0" max="253"><button id="set" class="pri">Set</button></div>
  <div class="sep"></div>
  <div class="row"><span class="lab">P</span><input id="kp" class="num" type="number" min="0" max="254"><span class="lab">D</span><input id="kd" class="num" type="number" min="0" max="254"><button id="gduck" title="Fill the replica's gains: P 5, D 20 (beak P 10)">Duck</button><button id="gset" class="pri" disabled>Set</button></div>
  </div>
</section>
<div id="tip" class="glass" hidden></div>
<div id="toast" class="glass"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const dark = matchMedia("(prefers-color-scheme: dark)");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nice = n => n.replace("left_", "L ").replace("right_", "R ").replace(/_/g, " ");
const found = new Map();
function slide(box, to) {                       // move a container's highlight under `to` (or hide it)
  const b = box.querySelector(".blob") || box.insertBefore(Object.assign(document.createElement("span"), { className: "blob" }), box.firstChild);
  if (!to) return b.style.opacity = 0;
  if (b.style.opacity !== "1") b.style.transition = "opacity .25s";            // first showing: appear in place, do not fly in
  b.style.left = to.offsetLeft + "px"; b.style.width = to.offsetWidth + "px"; b.offsetWidth; b.style.transition = ""; b.style.opacity = 1;
}
let scanning = false, S = { connected: false, ids: [], motors: {}, duck: {}, ports: [], bauds: [] }, sel = null, aim = null, servos = [], housings = {};
const marks = {}, open = new Set(), proj = {};         // sensors: 3-D marker, which are on, their 3-D overlay

// ---- server ------------------------------------------------------------------------------------------------------
async function api(name, body) {
  const r = await fetch("/api/" + name, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { toast(j.error || "failed", true); throw new Error(j.error); }
  if (j.ids) {
    const before = S.ids, was = S.connected, duck = S.brain && S.brain.on; S = j;
    if (name.startsWith("state") && duck !== undefined && duck !== j.brain.on) toast(j.brain.on ? "Duck connected" : "Duck lost", !j.brain.on);
    const fresh = j.ids.filter(id => !before.includes(id));
    if (was && j.connected && name.startsWith("state")) {            // hot-plug, noticed by the server
      if (fresh.length) toast(fresh.join(", ") + " connected");
      else if (before.some(id => !j.ids.includes(id))) toast(before.filter(id => !j.ids.includes(id)).join(", ") + " removed");
    }
    if (fresh.length && j.ids.length === 1 && sel == null) pick(fresh[0]);           // a lone new servo opens by itself
    else render();
  }
  return j;
}
let toastT, lowT = 0, hotT = 0, edgeT = "";
const HOT = [75, 85];            // °C: the two points where the board itself starts slowing its processor
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = "glass show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "glass", 2600);
}
let seq = 0;
(async function poll() {
  try { ingest(await api("state?since=" + seq)); } catch (e) {}
  setTimeout(poll, S.connected ? 100 : 1500);
})();

// ---- 3-D duck: translucent shell, solid servos --------------------------------------------------------------------
const el = $("vw"), R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
R.setPixelRatio(Math.min(2, devicePixelRatio)); el.appendChild(R.domElement);
const scene = new THREE.Scene(), body = new THREE.Group(), cam = new THREE.PerspectiveCamera(30, 1, .01, 20);
cam.up.set(0, 0, 1); cam.position.set(.44, -.5, .27);
scene.add(body, new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.1));      // body = the whole duck; the IMU tilts it
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(.6, -.8, 1.4); scene.add(sun);
const ctl = new THREE.OrbitControls(cam, R.domElement);
ctl.enableDamping = true; ctl.enablePan = false; ctl.target.set(0, 0, .125); ctl.minDistance = .3; ctl.maxDistance = 4;
function size() { R.setSize(el.clientWidth, el.clientHeight, false); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); }
addEventListener("resize", () => { size(); dirty = true; }); size();

fetch("duck.bin").then(r => r.arrayBuffer()).then(buf => {
